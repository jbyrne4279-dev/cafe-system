name: Deploy to Railway

# Deploys the site to Railway on every push to main (and on manual run).
# Requires a repository secret named RAILWAY_TOKEN:
#   Railway → your project → Settings → Tokens → create a token
#   GitHub  → repo → Settings → Secrets and variables → Actions → New secret
#            name: RAILWAY_TOKEN   value: <the token>

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: railway up --service cafe-system --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
