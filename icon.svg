<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Café Records">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17b3a3"/>
      <stop offset="1" stop-color="#0c7d72"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- steam -->
  <g fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.9">
    <path d="M214 168 q-18 -20 0 -40 q18 -20 0 -40"/>
    <path d="M256 172 q-18 -20 0 -40 q18 -20 0 -40"/>
    <path d="M298 168 q-18 -20 0 -40 q18 -20 0 -40"/>
  </g>

  <!-- saucer -->
